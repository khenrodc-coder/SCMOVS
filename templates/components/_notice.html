<div class="p-6 text-center">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-amber-50 text-amber-700"><i class="fa-solid {{ icon }} text-lg" aria-hidden="true"></i></span>
    <h2 class="mt-3 text-base font-bold text-blue-950" style="font-family:inherit">{{ title }}</h2>
    <p class="mt-1 text-sm text-slate-600">{{ message }}</p>
    <button type="button" data-modal-close class="mt-4 rounded-lg bg-blue-900 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-200">OK</button>
</div>

{# Usage: {% from "components/form_errors.html" import form_errors %}  {{ form_errors(errors) }} #}
{% macro form_errors(errors) %}
{% if errors %}
<div class="mt-4 max-w-lg bg-red-50 border border-red-300 border-l-4 border-l-red-500 text-red-900 rounded-lg px-4 py-3 text-sm" role="alert">
    <ul class="list-disc pl-5 space-y-1">
        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
    </ul>
</div>
{% endif %}
{% endmacro %}

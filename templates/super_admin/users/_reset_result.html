<div class="px-5 py-5 text-center">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-green-50 text-green-700"><i class="fa-solid fa-circle-check text-xl"></i></span>
    <h2 class="mt-3 text-base font-bold text-blue-950" style="font-family:inherit">Temporary password created</h2>
    <p class="mt-1 text-sm text-slate-600">For <strong>{{ target.full_name }}</strong> ({{ target.username }}). Give it to them securely; they must change it at first login.</p>
    <div class="mt-4 flex items-center justify-center gap-2">
        <input id="temp-pw" type="text" readonly value="{{ temp_password }}" class="w-64 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-center font-mono text-base font-bold tracking-wider" onfocus="this.select()">
        <button type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('temp-pw').value);this.innerHTML='<i class=&quot;fa-solid fa-check&quot;></i> Copied'" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-slate-50"><i class="fa-regular fa-copy"></i> Copy</button>
    </div>
    <p class="mt-3 text-xs font-semibold text-amber-700"><i class="fa-solid fa-triangle-exclamation"></i> This is the only time it will be shown.</p>
    <button type="button" data-modal-close class="mt-5 rounded-lg bg-blue-900 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-800">Done</button>
</div>

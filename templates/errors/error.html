{% extends "base.html" %}
{% block title %}{{ code }} {{ title }}{% endblock %}

{% block body %}
<div class="h-1.5 bg-amber-400" aria-hidden="true"></div>
<main class="flex flex-1 items-center justify-center px-4 py-12">
    <div class="w-full max-w-md rounded-xl border border-slate-200 border-t-4 border-t-blue-900 bg-white p-8 text-center shadow-sm">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Holy Cross College seal" class="mx-auto h-16 w-16 object-contain">
        <p class="mt-4 font-num text-6xl font-extrabold tracking-tight text-blue-950">{{ code }}</p>
        <h1 class="mt-2 text-xl font-bold text-slate-900">{{ title }}</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">{{ message }}</p>
        <a href="{{ url_for('main.landing') }}"
           class="mt-6 inline-flex min-h-[44px] items-center justify-center gap-2 rounded-lg bg-blue-900 px-5 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-200">
            <i class="fa-solid fa-house" aria-hidden="true"></i> Back to Home
        </a>
    </div>
</main>
{% endblock %}

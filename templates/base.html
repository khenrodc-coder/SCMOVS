<!DOCTYPE html>
<html lang="en"{% if current_user and current_user.role == 'super_admin' and current_user.theme_preference == 'dark' %} class="dark"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>
        {% block title %}{{ system_name }}{% endblock %} | {{ system_name }}
    </title>

    <!-- Fonts: Inter (UI text), Playfair Display (headings), Roboto (numbers).
         Meiryo is a system font (not on Google Fonts), so it is listed first with fallbacks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        // font-sans (default) = Inter: small text, labels, helper text, body.
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Arial', 'sans-serif'],
                        // font-heading = Playfair Display: page and section headings.
                        heading: ['"Playfair Display"', 'Georgia', '"Times New Roman"', 'serif'],
                        // font-display = Meiryo: large display text (hero / brand titles).
                        display: ['Meiryo', '"メイリオ"', '"Hiragino Kaku Gothic ProN"', '"Hiragino Sans"', '"Yu Gothic"', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        // font-num = Roboto: statistics, counts, amounts, percentages.
                        num: ['Roboto', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        /* Typography scale (one place to adjust):
           display  -> font-display (Meiryo)            hero / brand titles
           headings -> h1, h2 = Playfair Display         page + section headings
           ui text  -> Inter (default); h3/h4 stay Inter compact card titles
           numbers  -> font-num (Roboto, tabular)        stats, counts, amounts, % */
        h1, h2 { font-family: "Playfair Display", Georgia, "Times New Roman", serif; }
        .font-num { font-variant-numeric: tabular-nums; letter-spacing: 0; }
        /* Edge adds its own reveal icon to password fields; we provide ours. */

        /* ---- Global modal (static/js/modal.js) ---- */
        html.modal-open { overflow: hidden; }
        .scmovs-modal-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
            padding: 1rem; background: rgba(15, 23, 42, .55); backdrop-filter: blur(2px); }
        .scmovs-modal-overlay[hidden] { display: none; }
        .scmovs-modal-dialog { width: 100%; max-width: 32rem; max-height: calc(100vh - 2rem); overflow-y: auto; border-radius: .9rem;
            background: #fff; color: #1e293b; box-shadow: 0 25px 50px -12px rgba(0,0,0,.4); }
        .scmovs-modal-dialog.wide, .scmovs-modal-dialog:has(.modal-wide) { max-width: 40rem; }

        /* A scrolling card must also be the anchor for absolutely positioned children (such as the screen-reader-only labels
           inside table buttons). Otherwise those escape the card's clipping and stretch the whole page sideways. */
        .overflow-x-auto, .overflow-auto { position: relative; }

        /* ---- Phone layout (under 768px) ---- */
        @media (max-width: 767px) {
            table.rt-stack { display: block; border: 0; }
            table.rt-stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
            table.rt-stack tbody { display: block; }
            table.rt-stack tbody > tr { display: block; margin: .6rem; padding: .35rem .8rem; border: 1px solid #e2e8f0; border-radius: .75rem; background: #fff; }
            table.rt-stack tbody > tr.rt-empty { border: 0; background: transparent; }
            table.rt-stack tbody > tr > td { display: flex; align-items: center; justify-content: space-between; gap: 1rem; width: 100%;
                padding: .4rem 0 !important; border: 0; text-align: right; white-space: normal !important; }
            table.rt-stack tbody > tr > td::before { content: attr(data-label); flex: 0 0 34%; max-width: 34%; text-align: left;
                font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #64748b; }
            table.rt-stack tbody > tr > td[data-label=""]::before { display: none; }
            table.rt-stack tbody > tr > td > * { min-width: 0; text-align: right; }
            table.rt-stack tbody > tr > td + td { border-top: 1px solid #f1f5f9; }
        }
        /* Modals: always inside the screen, buttons easy to reach on a phone */
        .scmovs-modal-dialog { max-height: calc(100vh - 1rem); max-height: calc(100dvh - 1rem); }
        @media (max-width: 479px) {
            .scmovs-modal-overlay { padding: .5rem; align-items: flex-end; }
            .scmovs-modal-dialog { border-radius: 1rem; }
            .scmovs-modal-dialog form > div:last-child { flex-direction: column-reverse; }
            .scmovs-modal-dialog form > div:last-child > button { width: 100%; }
        }
        .field-invalid { border-color: #dc2626 !important; }
        .field-invalid:focus { box-shadow: 0 0 0 4px rgba(220, 38, 38, .2) !important; }
        @media (prefers-reduced-motion: no-preference) { .scmovs-modal-dialog { animation: modal-in .16s ease-out; } }
        @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
        input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
    </style>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark.css') }}">
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    {% block body %}{% endblock %}

    <!-- Flask Flash Messages -->
    <script id="scmovs-flash-data" type="application/json">
        {{ get_flashed_messages(with_categories=true) | tojson | safe }}
    </script>
    <script>
        const flashDataEl = document.getElementById("scmovs-flash-data");
        window.SCMOVS_FLASH = flashDataEl ? JSON.parse(flashDataEl.textContent) : [];
    </script>

    <!-- Password show/hide (buttons come from components/icons.html: password_toggle) -->
    <script>
        (function () {
            function setState(btn, show) {
                var input = document.getElementById(btn.getAttribute("aria-controls"));
                if (!input) return;
                input.type = show ? "text" : "password";   // value is untouched, so nothing is lost
                var label = show ? "Hide password" : "Show password";
                btn.setAttribute("aria-label", label);
                btn.setAttribute("title", label);
                var s = btn.querySelector("[data-icon-show]"), h = btn.querySelector("[data-icon-hide]");
                if (s) s.classList.toggle("hidden", show);
                if (h) h.classList.toggle("hidden", !show);
            }
            document.addEventListener("click", function (e) {
                var btn = e.target.closest("[data-password-toggle]");
                if (!btn) return;
                var input = document.getElementById(btn.getAttribute("aria-controls"));
                setState(btn, !!input && input.type === "password");
            });
            // Never leave a password revealed when the page is restored from the back/forward cache.
            window.addEventListener("pageshow", function (e) {
                if (!e.persisted) return;
                document.querySelectorAll("[data-password-toggle]").forEach(function (b) { setState(b, false); });
            });
        })();
    </script>

    <!-- Main JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/icon_select.js') }}"></script>
    <script src="{{ url_for('static', filename='js/form_rules.js') }}"></script>
    <script src="{{ url_for('static', filename='js/select_icons.js') }}"></script>
    <script src="{{ url_for('static', filename='js/responsive_tables.js') }}"></script>

    {% block scripts %}{% endblock %}

</body>
</html>
